<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Log In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-card">
    <h2>Login</h2>
    <form action="#" method="POST">
      <div class="input-group">
        <label for="email">Email / Username</label>
        <input type="email" id="email" required placeholder="Enter Your E-mail Address">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter Your Pasword">
      </div>

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <div class="switch-link">
      <p>I Don't have an account? <a href="signup.html">Click Here to SignUp</a></p>
      <p><a href="index.html">← Back to HomePage</a></p>
    </div>
  </div>

</body>
</html>
