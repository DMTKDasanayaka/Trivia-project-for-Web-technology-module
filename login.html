<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Log In</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    .glass-card {
      background: rgba(20, 25, 40, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.12);
      border-color: #0d6efd;
      color: #fff;
      box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        
        <div class="card glass-card text-white shadow-lg p-4">
          <div class="card-body">
            <h2 class="card-title text-center mb-4 fw-bold">Login</h2>
            
            <form id="loginForm" action="#" method="POST">
              <div class="mb-3">
                <label for="email" class="form-label">Email / Username</label>
                <input type="text" class="form-control" id="email" required placeholder="Enter Your E-mail or Username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Enter Your Password">
              </div>

              <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-semibold">Login</button>
            </form>

            <div class="switch-link text-center mt-4">
              <p class="mb-1 text-white-50">Don't have an account? <a href="signup.html" class="text-info text-decoration-none fw-semibold">SignUp</a></p>
              <p class="mb-0"><a href="index.html" class="text-light text-decoration-none small">← Back to HomePage</a></p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const emailInput = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const formData = new FormData();
      formData.append('email', emailInput);
      formData.append('password', password);

      try {
        const response = await fetch('login.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.status === 'success') {
          alert('Login Successful!');
          
          // User name එක backend එකෙන් එන නම හෝ emailInput එකෙන් ලබා ගැනීම
          const displayName = data.user && data.user.fullname 
            ? data.user.fullname 
            : (data.user && data.user.username ? data.user.username : emailInput.split('@')[0]);

          localStorage.setItem('username', displayName);
          localStorage.setItem('user', JSON.stringify(data.user || { name: displayName }));

          window.location.href = 'live.html';
        } else {
          alert(data.message || 'Invalid Credentials');
        }
      } catch (error) {
        console.error('Error:', error);
        // Backend එකක් නොමැතිව direct test කිරීමට සකස් කළ fallback එක
        const fallbackName = emailInput.split('@')[0] || 'User';
        localStorage.setItem('username', fallbackName);
        alert('Logged in as ' + fallbackName);
        window.location.href = 'live.html';
      }
    });
  </script>
</body>
</html>
