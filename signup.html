<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-card">
    <h2>Sign Up</h2>
    <form action="#" method="POST">
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" required placeholder="Enter Your Full Name">
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="E-Mail Address">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter New Password">
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div class="switch-link">
      <p>I Already havs an account  <a href="login.html">Login Here</a></p>
      <p><a href="index.html">← Back to HomePage</a></p>
    </div>
  </div>

</body>
</html>
