<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Register</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    .glass-card {
      background: rgba(20, 25, 40, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.12);
      border-color: #0d6efd;
      color: #fff;
      box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100 my-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        
        <div class="card glass-card text-white shadow-lg p-4">
          <div class="card-body">
            <h2 class="card-title text-center mb-4 fw-bold">Sign Up</h2>
            
            <form id="signupForm" action="#" method="POST">
              <div class="mb-3">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullname" required placeholder="Enter Your Full Name">
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required placeholder="E-Mail Address">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Enter New Password">
              </div>

              <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-semibold">Register</button>
            </form>

            <div class="switch-link text-center mt-4">
              <p class="mb-1 text-white-50">Already have an account? <a href="login.html" class="text-info text-decoration-none fw-semibold">Login Here</a></p>
              <p class="mb-0"><a href="index.html" class="text-light text-decoration-none small">← Back to HomePage</a></p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const formData = new FormData();
      formData.append('fullname', fullname);
      formData.append('email', email);
      formData.append('password', password);

      // Store username locally so it carries over to live page
      localStorage.setItem('username', fullname);

      try {
        const response = await fetch('signup.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.status === 'success') {
          alert('Registration Successful! Redirecting...');
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Registration completed.');
          window.location.href = 'login.html';
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Registration saved! Redirecting to login...');
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
